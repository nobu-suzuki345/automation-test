name: schedule-dashboard CI

# schedule-dashboard 配下の変更時のみ、型チェック + 本番ビルドを実行する
on:
  push:
    paths:
      - "schedule-dashboard/**"
      - ".github/workflows/schedule-dashboard-ci.yml"
  pull_request:
    paths:
      - "schedule-dashboard/**"
      - ".github/workflows/schedule-dashboard-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: schedule-dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: schedule-dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check & build
        run: npm run build
